<!doctype html>
<html><head><meta charset="utf-8"><title>Model Lab</title>
<style>html,body{margin:0;background:#20221c;color:#ddd;font:13px monospace}canvas{display:block}#info{position:fixed;left:6px;top:4px;white-space:pre;pointer-events:none;text-shadow:0 1px 2px #000}</style>
</head><body><div id="info"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.18.1/meshopt_decoder.js"></script>
<script>
// Model lab: load a packed .glb, look at it from four sides, and try turret/gun splits.
const W = 1200, H = 800;
const R = new THREE.WebGLRenderer({antialias: true}); R.setSize(W, H); R.setClearColor(0x2a2d26); document.body.appendChild(R.domElement);
R.autoClear = false;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x445544, .9));
const sun = new THREE.DirectionalLight(0xffffff, .8); sun.position.set(5, 10, 7); scene.add(sun);
scene.add(new THREE.GridHelper(20, 20, 0x666655, 0x444438));
const axes = new THREE.AxesHelper(3); scene.add(axes);   // x red, y green, z blue
const loader = new THREE.GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const lab = window.lab = {root: null, info: {}};
function views() {
  R.clear();
  const b = new THREE.Box3().setFromObject(lab.root || scene), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3()), d = Math.max(s.x, s.y, s.z) * 1.1 || 5;
  const cams = [[c.x, c.y, c.z + d * 2, 'FRONT? (looking -z)'], [c.x + d * 2, c.y, c.z, 'RIGHT (looking -x)'], [c.x, c.y + d * 2, c.z + .001, 'TOP (looking down, x right, z down)'], [c.x + d * 1.3, c.y + d, c.z + d * 1.3, '3/4']];
  cams.forEach(([x, y, z, label], i) => {
    const cam = new THREE.OrthographicCamera(-d, d, d * .66, -d * .66, .01, d * 10); cam.position.set(x, y, z); cam.lookAt(c);
    const vx = (i % 2) * W / 2, vy = (i < 2 ? H / 2 : 0);
    R.setViewport(vx, vy, W / 2, H / 2); R.setScissor(vx, vy, W / 2, H / 2); R.setScissorTest(true); R.render(scene, cam);
  });
  R.setScissorTest(false);
}
lab.load = name => new Promise((ok, bad) => loader.load((window.LAB_DIR || '../assets/tanks/') + name + '.glb', g => {
  if (lab.root) scene.remove(lab.root);
  lab.root = g.scene; scene.add(g.scene); g.scene.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(g.scene), s = b.getSize(new THREE.Vector3());
  const names = []; g.scene.traverse(o => { if (o.name && o.isMesh) names.push(o.name); });
  lab.info = {name, size: s.toArray().map(v => +v.toFixed(2)), min: b.min.toArray().map(v => +v.toFixed(2)), max: b.max.toArray().map(v => +v.toFixed(2)), meshes: names.length};
  document.getElementById('info').textContent = JSON.stringify(lab.info) + '\nTL front?  TR right  BL top  BR 3/4   axes: x red, y green, z blue';
  views(); ok(lab.info);
}, undefined, bad));
// colour triangles by a classifier fn(x,y,z) -> 'turret' | 'gun' | null, in model space after `xf` (a Matrix4 that orients the model)
lab.paint = (cls) => {
  const red = new THREE.MeshBasicMaterial({color: 0xff3030, side: THREE.DoubleSide}), blue = new THREE.MeshBasicMaterial({color: 0x3080ff, side: THREE.DoubleSide});
  const v = new THREE.Vector3(); let n = {turret: 0, gun: 0, hull: 0};
  lab.root.traverse(o => {
    if (!o.isMesh || o.userData.painted) return;
    const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone(), p = geo.attributes.position;
    const groups = {turret: [], gun: []};
    for (let i = 0; i < p.count; i += 3) {
      let cx = 0, cy = 0, cz = 0;
      for (let k = 0; k < 3; k++) { v.fromBufferAttribute(p, i + k).applyMatrix4(o.matrixWorld); cx += v.x / 3; cy += v.y / 3; cz += v.z / 3; }
      const c = cls(cx, cy, cz); if (c) { groups[c].push(i); n[c]++; } else n.hull++;
    }
    for (const [k, list] of Object.entries(groups)) if (list.length) {
      const pos = new Float32Array(list.length * 9); list.forEach((i, j) => { for (let q = 0; q < 9; q++) pos[j * 9 + q] = p.array[i * 3 + q]; });
      const g2 = new THREE.BufferGeometry(); g2.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const m = new THREE.Mesh(g2, k === 'turret' ? red : blue); m.userData.painted = true; m.renderOrder = 2;
      m.matrixAutoUpdate = false; m.matrix.copy(o.matrixWorld); scene.add(m); (lab.paints = lab.paints || []).push(m);
    }
  });
  views(); return n;
};
lab.unpaint = () => { (lab.paints || []).forEach(m => scene.remove(m)); lab.paints = []; views(); };
lab.views = views;
</script></body></html>
